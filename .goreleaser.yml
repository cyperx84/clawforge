project_name: clawforge
version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

builds:
  - id: clawforge
    main: .
    binary: clawforge
    ldflags:
      - -X github.com/cyperx84/clawforge/cmd.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: clawforge
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: cyperx84
    name: clawforge
  draft: false
  prerelease: auto
  name_template: 'v{{.Version}}'

brews:
  - repository:
      owner: cyperx84
      name: homebrew-tap
    folder: Formula
    homepage: "https://github.com/cyperx84/clawforge"
    description: "ClawForge — Multi-agent orchestration CLI & TUI"
    license: "MIT"
    skip_upload: false
    dependencies:
      - name: go

nfpms:
  - file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    homepage: 'https://github.com/cyperx84/clawforge'
    description: 'ClawForge — Multi-agent orchestration CLI & TUI'
    maintainer: 'Cyperx <cyperx@example.com>'
    license: MIT
    vendor: Cyperx
    bindir: /usr/local/bin
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/clawforge/LICENSE
    formats:
      - apk
      - deb
      - rpm
